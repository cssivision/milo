[package]
name = "milo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "milo"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
env_logger = "0.11"
futures-util = "0.3"
getopts = "0.2"
log = "0.4"
rig = "0.47"
rig-memory = { version = "0.47", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1.0"
uuid = { version = "1.18", features = ["v4"] }
